<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Petición asistida de Microbiología</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{
  --teal-primary:#006E69;--teal-dark:#005F5A;--teal-selected:#006E69;--teal-light:#B5E2DF;
  --teal-tab-inactive:#1F7F78;--grey-header:#EFEFEF;--grey-open:#D9D9D9;--grey-list:#F9F8F8;
  --grey-search:#ECECEC;--white:#FFFFFF;--text:#000;--text-muted:#666666;--alert:#FF0000;
  --radius:3px;--row:47px;--pad:16px;--t:180ms;
}
*{box-sizing:border-box}
html,body{height:100%}
body{margin:0;font-family:Inter,"Segoe UI",Arial,sans-serif;font-size:15px;color:var(--text);background:var(--white);line-height:1.3;-webkit-font-smoothing:antialiased}
button{font:inherit;color:inherit;cursor:pointer}
button:focus-visible,input:focus-visible,a:focus-visible{outline:3px solid #FFC845;outline-offset:2px}
.sr-only{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}

/* ---- Barra simulada de la historia clínica ---- */
.hce{background:var(--teal-dark);color:#fff;height:52px;display:flex;align-items:center;padding:0 45px;gap:40px;font-size:12px;font-weight:600}
.hce-brand{font-size:18px;font-weight:700;letter-spacing:.5px;background:#fff;color:var(--teal-dark);padding:4px 10px;border-radius:var(--radius)}
.hce-field span{font-weight:400;opacity:.9;margin-left:6px}

/* ---- Barra de título ---- */
.titlebar{background:#fff;color:#000;height:var(--row);display:flex;align-items:center;justify-content:space-between;padding:0 45px}
.titlebar h1{margin:0;font-size:20px;font-weight:700}
.guide:focus-visible{outline-color:#005F5A}
.guide{color:#555;text-decoration:none;display:flex;align-items:center;gap:10px;font-size:14px;font-weight:400;border-radius:var(--radius);padding:4px 6px}
.guide b{font-weight:600}
.guide:hover{text-decoration:underline}

/* ---- Maqueta ---- */
.main{display:grid;grid-template-columns:1fr 1fr;gap:44px;padding:28px 45px 24px;height:calc(100vh - 52px - 47px);min-height:640px}
.panel{display:flex;flex-direction:column;min-height:0;background:var(--teal-primary);border-radius:var(--radius);overflow:hidden}
.panel-title{flex:none;margin:0;height:var(--row);display:flex;align-items:center;justify-content:center;background:var(--teal-primary);color:#fff;font-weight:600;font-size:18px;border-radius:var(--radius) var(--radius) 0 0}
.panel-head{flex:none;padding:8px 8px;display:flex;gap:8px;align-items:center}
.search{flex:1;position:relative}
.search input{width:100%;height:35px;border:3px solid var(--grey-search);border-radius:var(--radius);background:#fff;padding:0 36px 0 10px;font-size:15px}
.search input::placeholder{color:#8a8a8a;font-style:italic}
.search svg{position:absolute;right:10px;top:50%;transform:translateY(-50%);pointer-events:none}
.seg{display:flex;background:#fff;border:3px solid var(--grey-search);border-radius:var(--radius);height:35px;flex:none}
.seg button{border:0;background:transparent;padding:0 12px;font-size:13px;font-weight:600;color:var(--text-muted);border-radius:1px}
.seg button[aria-pressed="true"]{background:var(--teal-dark);color:#fff}
.panel-body{flex:1;min-height:0;overflow-y:auto;padding:0 8px 8px;scrollbar-width:none;-ms-overflow-style:none}
.panel-body::-webkit-scrollbar{display:none}
.cart-body{scrollbar-width:none}
.cart-body::-webkit-scrollbar{display:none}

/* ---- Acordeón ---- */
.cat{background:var(--grey-list);border-radius:var(--radius);margin-bottom:8px;overflow:hidden}
.cat-head{width:100%;min-height:var(--row);border:0;background:var(--grey-header);display:flex;align-items:center;justify-content:space-between;padding:0 var(--pad);font-size:17px;font-weight:700;text-align:left}
.cat-head svg{transition:transform var(--t)}
.cat-head[aria-expanded="true"] svg{transform:rotate(180deg)}
.cat-body{display:none}
.cat-body.open{display:block;animation:fade var(--t) ease-out}
@keyframes fade{from{opacity:0;transform:translateY(-3px)}to{opacity:1;transform:none}}

.grp{width:100%;min-height:var(--row);border:0;background:transparent;text-align:left;padding:8px var(--pad);font-size:16px;font-weight:500;display:flex;align-items:center;transition:background var(--t),color var(--t)}
.cat-body.has-open .grp{color:var(--text-muted)}
.cat-body.has-open .grp[aria-expanded="true"]{background:var(--grey-open);color:var(--text)}
.grp:hover{background:#efeeee}

.syn{width:100%;min-height:var(--row);border:0;background:var(--teal-light);text-align:left;padding:8px var(--pad);font-size:16px;font-weight:500;display:flex;align-items:center;transition:background var(--t)}
.syn:hover{background:#a5dbd7}
.syn[aria-current="true"]:hover{background:#005F5A}
.syn[aria-current="true"]{background:var(--teal-selected);color:#fff}
.syn:focus-visible{outline-offset:-4px}
.syn-content{background:#fff;padding:6px var(--pad) 10px;border-radius:0 0 var(--radius) var(--radius);animation:fade var(--t) ease-out}

/* ---- Chip muestra-prueba ---- */
.chip{display:grid;grid-template-columns:35% 1fr;min-height:var(--row);background:var(--grey-open);border:1px solid var(--grey-open);border-radius:var(--radius);margin:6px 0;font-size:14px;overflow:hidden;width:100%;text-align:left;padding:0}
.chip-m{background:#fff;border-radius:var(--radius);margin:1px;padding:6px 10px;display:flex;align-items:center;font-weight:400}
.chip-p{padding:6px 12px;display:flex;align-items:center;font-weight:300;position:relative}
.chip-p .pt{display:block}
.chip-p .sep{opacity:.7}
.np-note{margin:6px 0;min-height:var(--row);border:1px solid var(--grey-open);border-radius:var(--radius);display:flex;align-items:center;gap:12px;padding:8px 14px;font-size:14px;line-height:1.35}
.np-note b{font-weight:600}
.np-note svg{flex:none}
button.chip{transition:box-shadow var(--t),border-color var(--t)}
button.chip:hover{border-color:var(--teal-dark)}
button.chip[aria-pressed="true"]{border-color:var(--teal-selected);box-shadow:inset 0 0 0 1px var(--teal-selected)}
button.chip[aria-pressed="true"] .chip-p{padding-right:30px}
button.chip[aria-pressed="true"] .chip-p::after{content:"✓";position:absolute;right:10px;top:50%;transform:translateY(-50%);color:var(--teal-selected);font-weight:600}

/* ---- Criterio: sección plegable ---- */
.crit{margin:10px 0 0;border:1px solid var(--grey-open);border-radius:var(--radius);overflow:hidden}
.crit-head{width:100%;min-height:var(--row);border:0;background:var(--grey-header);display:flex;align-items:center;gap:12px;padding:8px 12px;font-size:15px;text-align:left}
.crit-head:hover{background:#e6e6e6}
.crit-head:focus-visible{outline-offset:-4px}
.crit-head svg{flex:none;margin-left:auto;transition:transform var(--t)}
.crit-head[aria-expanded="true"] svg{transform:rotate(180deg)}
.crit em{font-style:normal;font-weight:600;color:var(--alert)}
.crit-chips{padding:2px 10px 6px;animation:fade var(--t) ease-out}
/* ---- Muestras ---- */
.mu{width:100%;min-height:var(--row);border:0;background:transparent;text-align:left;padding:8px var(--pad);font-size:16px;font-weight:500;display:flex;align-items:center;transition:background var(--t),color var(--t)}
.cat-body.has-open .mu{color:var(--text-muted)}
.cat-body.has-open .mu[aria-expanded="true"]{background:var(--grey-open);color:var(--text)}
.mu:hover{background:#efeeee}
.mu-content{background:#fff;padding:6px var(--pad) 10px;border-radius:0 0 var(--radius) var(--radius);animation:fade var(--t) ease-out}
.hint{font-size:13px;color:var(--text-muted);padding:6px 0 2px}

/* ---- Perfiles ---- */
.perfil{width:100%;border:0;background:#fff;border-radius:var(--radius);margin:0 0 8px;padding:10px var(--pad);text-align:left;display:grid;gap:4px;transition:box-shadow var(--t)}
.perfil:hover{box-shadow:0 0 0 2px var(--teal-dark) inset}
.perfil-n{font-size:16px;font-weight:500}
.perfil-p{font-size:14px;font-weight:300}
.perfil-c{font-size:13px;color:var(--text-muted)}
.perfil[aria-pressed="true"]{box-shadow:inset 3px 0 0 var(--teal-selected)}
.perfil[aria-pressed="true"] .perfil-n::after{content:"  ✓ en la petición";color:var(--teal-selected);font-size:13px;font-weight:600}

/* ---- Carro ---- */
.cart{display:flex;flex-direction:column;min-height:0;background:var(--grey-header);border-radius:var(--radius)}
.cart-head{flex:none;display:flex;align-items:center;justify-content:space-between;padding:12px 16px 4px;min-height:var(--row)}
.cart-head h2{margin:0;font-size:17px;font-weight:700}
.cart-count{font-size:14px;font-weight:400;color:#444;margin-left:8px}
.link{border:0;background:transparent;font-size:14px;color:var(--teal-dark);font-weight:600;text-decoration:underline;padding:4px 6px;border-radius:var(--radius)}
.link:disabled{color:var(--text-muted);text-decoration:none;cursor:default}
.cart-body{flex:1;min-height:0;overflow-y:auto;padding:4px 16px 8px}
.cart-empty{color:var(--text-muted);font-size:15px;padding:40px 16px;text-align:center;line-height:1.5}
.cart-line{display:grid;grid-template-columns:1fr 34px;gap:6px;align-items:center}
.cart-line .chip{margin:0;background:var(--grey-open)}
.cart-line .chip-p{padding-right:8px}
.x{width:34px;height:34px;border:1px solid var(--grey-open);background:#fff;border-radius:var(--radius);font-size:20px;line-height:1;color:#333}
.x:hover{background:var(--grey-open)}
.cart-foot{flex:none;padding:10px 16px 16px;display:flex;gap:12px;align-items:center;justify-content:flex-end;border-top:1px solid var(--grey-open)}
.btn{height:44px;padding:0 24px;border:0;border-radius:var(--radius);background:var(--teal-dark);color:#fff;font-size:16px;font-weight:600}
.btn:hover{background:#004F4B}
.btn:disabled{background:#8FB9B6;cursor:default}

/* ---- Diálogo ---- */
dialog{border:0;border-radius:var(--radius);padding:0;width:min(640px,90vw);max-height:85vh;font-family:inherit}
dialog::backdrop{background:rgba(0,0,0,.35)}
.dlg-h{background:var(--teal-dark);color:#fff;padding:12px 20px;font-size:17px;font-weight:700}
.dlg-b{padding:16px 20px;overflow:auto;max-height:60vh;font-size:14px}
.dlg-b h3{font-size:14px;margin:12px 0 4px;font-weight:600}
.dlg-b ul{margin:0;padding-left:20px}
.dlg-f{padding:12px 20px;display:flex;justify-content:flex-end;gap:8px;border-top:1px solid var(--grey-open)}
.empty{color:var(--text-muted);padding:14px var(--pad);font-size:14px}
/* ---- Barra de pestañas (solo móvil) ---- */
.tabbar{display:none}

/* ---- Móvil: hasta 800 px de ancho, o móvil apaisado ---- */
@media (max-width:800px), (pointer:coarse) and (max-height:500px){
  body{display:flex;flex-direction:column;height:100vh;height:100dvh;overflow:hidden}
  .hce{display:none}
  .titlebar{flex:none;height:auto;flex-direction:column;align-items:flex-start;gap:2px;padding:10px 14px}
  .titlebar h1{font-size:16px}
  .guide{font-size:12px;padding:2px 0;gap:6px}
  .guide svg{width:14px;height:14px}
  .main{flex:1;min-height:0;height:auto;display:block;padding:0}
  .panel,.cart{height:100%;border-radius:0}
  body[data-view="elegir"] .cart{display:none}
  body[data-view="peticion"] .panel{display:none}
  .panel-title{display:none}
  .panel-head{padding:8px}
  .search input{height:36px;font-size:16px}
  .seg{height:36px}
  .seg button{padding:0 10px;font-size:12px}
  .panel-body{padding:0 8px 8px}
  .cat-head{font-size:16px}
  .grp,.syn,.mu{font-size:15px}
  .crit-head{font-size:14px}
  .syn-content,.mu-content{padding:6px 10px 10px}
  .crit-chips{padding:2px 8px 6px}
  .chip{font-size:13.5px}
  .chip-m{padding:6px 8px}
  .chip-p{padding:6px 10px}
  .cart-head{padding:12px 14px 4px}
  .cart-body{padding:4px 14px 8px}
  .cart-foot{padding:10px 14px 14px}
  .cart-foot .btn{width:100%}
  .tabbar{flex:none;display:grid;grid-template-columns:1fr 1fr;background:#fff;border-top:1px solid var(--grey-open);padding-bottom:env(safe-area-inset-bottom)}
  .tabbtn{position:relative;height:60px;border:0;background:transparent;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;font-size:12px;color:#555}
  .tabbtn[aria-current="true"]{color:var(--teal-dark);font-weight:600;box-shadow:inset 0 3px 0 var(--teal-dark)}
  .tabbtn:focus-visible{outline-color:#005F5A;outline-offset:-4px}
  .badge{position:absolute;top:7px;left:calc(50% + 6px);min-width:18px;height:18px;padding:0 5px;border-radius:9px;background:var(--teal-dark);color:#fff;font-size:11px;font-weight:600;display:grid;place-content:center}
  .badge[hidden]{display:none}
}
</style>
</head>

    if (l.muestra === NP) return;
    if (!idx.has(l.muestra)) idx.set(l.muestra, new Map());
    const m = idx.get(l.muestra);
    l.pruebas.forEach(p => { if (p.nombre !== NP && !m.has(p.nombre)) m.set(p.nombre, p.loinc); });
  })));
  return new Map([...idx.entries()].sort((a, b) => a[0].localeCompare(b[0], 'es')));
}

/* ---------- Carro: líneas atómicas ---------- */
// Cada línea (muestra + sus pruebas) es un pack indivisible: se añade y se quita entera.
const lineKeyOf = l => l.muestra + '␟' + l.pruebas.map(p => p.nombre).join('␞');
function cartHas(m, p){ for (const l of state.cart.values()) if (l.muestra === m && l.pruebas.some(x => x.nombre === p)) return true; return false; }
function lineInCart(l){ return l.muestra !== NP && (state.cart.has(lineKeyOf(l)) || l.pruebas.every(p => cartHas(l.muestra, p.nombre))); }
function addLine(l){
  if (l.muestra === NP) return;
  const k = lineKeyOf(l);
  if (state.cart.has(k)) return;
  if (l.pruebas.length === 1 && cartHas(l.muestra, l.pruebas[0].nombre)) return;   // ya cubierta por un pack
  // un pack nuevo absorbe las pruebas sueltas de la misma muestra que ya contenga
  for (const [kk, ll] of [...state.cart]) {
    if (ll.muestra === l.muestra && ll.pruebas.length === 1 && l.pruebas.some(p => p.nombre === ll.pruebas[0].nombre)) state.cart.delete(kk);
  }
  state.cart.set(k, { muestra: l.muestra, pruebas: l.pruebas.map(p => ({ nombre: p.nombre, loinc: p.loinc })), ambito: l.ambito || '' });
}
function removeLine(l){ state.cart.delete(lineKeyOf(l)); }
function cartCount(){ const s = new Set(); state.cart.forEach(l => l.pruebas.forEach(p => s.add(l.muestra + '␟' + p.nombre))); return s.size; }

/* ---------- Render: chips ---------- */
function chipHTML(l, pressed, key){
  if (l.muestra === NP) return '';
  const pr = l.pruebas.map(p => '<span data-loinc="' + esc(p.loinc) + '">' + fmt(p.nombre) + '</span>').join('<span class="sep">; </span>');
  return '<button type="button" class="chip" data-act="line" data-key="' + esc(key) + '" aria-pressed="' + pressed + '" data-ambito="' + esc(l.ambito) + '">' +
    '<span class="chip-m">' + fmt(l.muestra) + '</span><span class="chip-p"><span class="pt">' + pr + '</span></span></button>';
}

/* ---------- Render: árbol de síndromes ---------- */
function renderAsistida(){
  const q = norm(state.q.trim());
  const groups = visibleGroups();
  let html = '';

  // --- Síndromes más frecuentes
  const open1 = state.cats.sind || !!q;
  html += '<section class="cat"><button type="button" class="cat-head" data-act="cat" data-cat="sind" aria-expanded="' + open1 + '">Síndromes más frecuentes' + chev + '</button>';
  html += '<div class="cat-body' + (open1 ? ' open' : '') + (state.openGroup ? ' has-open' : '') + '">';
  let shown = 0;
  groups.forEach((g, gi) => {
    const gMatch = !q || norm(grpLabel(g.grupo)).includes(q);
    const syns = g.sindromes.map((s, si) => ({ s, si, match: !q || gMatch || norm(s.nombre).includes(q) || s.lineas.some(l => lineMatches(l, q)) })).filter(x => x.match);
    if (!syns.length) return;
    shown++;
    const isOpen = q ? true : state.openGroup === g.grupo;
    html += '<button type="button" class="grp" data-act="grp" data-key="' + esc(g.grupo) + '" aria-expanded="' + isOpen + '">' + fmt(grpLabel(g.grupo)) + '</button>';
    if (isOpen) {
      syns.forEach(({ s }) => {
        const key = synKey(g, s);
        const sel = state.selSyn === key;
        html += '<button type="button" class="syn" data-act="syn" data-key="' + esc(key) + '" aria-current="' + sel + '">' + fmt(s.nombre) + '</button>';
        if (sel) html += renderSynContent(g, s, key);
      });
    }
  });
  if (!shown) html += '<div class="empty">Ningún síndrome coincide con la búsqueda.</div>';
  html += '</div></section>';

  // --- Muestras
  const idx = muestrasIndex();
  let mus = [...idx.entries()];
  if (q) mus = mus.filter(([m, pr]) => norm(m).includes(q) || [...pr.keys()].some(p => norm(p).includes(q)));
  const open2 = state.cats.muestras || (!!q && mus.length > 0);
  html += '<section class="cat"><button type="button" class="cat-head" data-act="cat" data-cat="muestras" aria-expanded="' + open2 + '">Muestras' + chev + '</button>';
  html += '<div class="cat-body' + (open2 ? ' open' : '') + (state.selMuestra ? ' has-open' : '') + '">';
  if (!mus.length) html += '<div class="empty">Ninguna muestra coincide con la búsqueda.</div>';
  mus.forEach(([m, pr]) => {
    const isOpen = state.selMuestra === m;
    html += '<button type="button" class="mu" data-act="mu" data-key="' + esc(m) + '" aria-expanded="' + isOpen + '">' + fmt(m) + '</button>';
    if (isOpen) {
      html += '<div class="mu-content">';
      const mName = norm(m).includes(q);
      [...pr.entries()].filter(([p]) => !q || mName || norm(p).includes(q)).sort((a, b) => a[0].localeCompare(b[0], 'es')).forEach(([p, loinc]) => {
        html += chipHTML({ muestra: m, pruebas: [{ nombre: p, loinc }], ambito: '' }, cartHas(m, p), 'mu\u241F' + m + '\u241F' + p);
      });
      html += '</div>';
    }
  });
  html += '</div></section>';
  return html;
}

function renderSynContent(g, s, key){
  const by = c => s.lineas.filter(l => l.criterio === c);
  const chk = state.checks[key] || {};
  let html = '<div class="syn-content">';
  const std = by('estandar');
  const realStd = std.filter(l => l.muestra !== NP);
  if (realStd.length) {
    realStd.forEach(l => html += chipHTML(l, lineInCart(l), key + '\u241F' + l.id));
  } else {
    const extras = [by('gravedad').length ? 'criterios de gravedad' : null, by('poco_frecuente').length ? 'sospecha de etiología poco frecuente' : null].filter(Boolean);
    html += '<div class="np-note"><svg width="18" height="18" viewBox="0 0 20 20" aria-hidden="true"><circle cx="10" cy="10" r="9" fill="none" stroke="#666" stroke-width="1.6"/><path d="M10 9v5M10 6.5v.5" stroke="#666" stroke-width="1.8" stroke-linecap="round"/></svg><span><b>Sin pruebas de rutina.</b>' + (extras.length ? ' Valorar solo si hay ' + extras.join(' o ') + '.' : '') + '</span></div>';
  }
  ['gravedad', 'poco_frecuente'].forEach(c => {
    const ls = by(c); if (!ls.length) return;
    const open = !!chk[c];
    html += '<div class="crit"><button type="button" class="crit-head" data-act="crit" data-key="' + esc(key) + '" data-crit="' + c + '" aria-expanded="' + open + '"><span>' + CRIT_TXT[c] + '</span>' + chev + '</button>';
    if (open) { html += '<div class="crit-chips">'; ls.forEach(l => html += chipHTML(l, lineInCart(l), key + '\u241F' + l.id)); html += '</div>'; }
    html += '</div>';
  });
  return html + '</div>';
}
function hash(s){ let h = 0; for (let i = 0; i < s.length; i++) h = (h * 31 + s.charCodeAt(i)) | 0; return h; }

/* ---------- Render: carro ---------- */
function renderCart(){
  const el = document.getElementById('cart');
  const n = cartCount();
  document.getElementById('count').textContent = n ? '· ' + n + (n === 1 ? ' prueba' : ' pruebas') : '';
  document.getElementById('clear').disabled = !n;
  document.getElementById('send').disabled = !n;
  const badge = document.getElementById('badge'); badge.textContent = n; badge.hidden = !n;
  if (!n) { el.innerHTML = '<div class="cart-empty">Todavía no hay pruebas en la petición.<br>Elige un síndrome o una muestra y pulsa las pruebas.</div>'; return; }
  let html = '';
  state.cart.forEach((l, k) => {
    const pr = l.pruebas.map(p => '<span data-loinc="' + esc(p.loinc) + '">' + fmt(p.nombre) + '</span>').join('<span class="sep">; </span>');
    const label = l.pruebas.length > 1 ? 'Quitar el pack ' + esc(l.muestra) + ' (' + l.pruebas.length + ' pruebas)' : 'Quitar ' + esc(l.pruebas[0].nombre);
    html += '<div class="cart-line"><div class="chip' + (l.pruebas.length > 1 ? ' pack' : '') + '" data-ambito="' + esc(l.ambito) + '"><span class="chip-m">' + fmt(l.muestra) + '</span><span class="chip-p"><span class="pt">' + pr + '</span></span></div>' +
      '<button type="button" class="x" data-act="rm" data-key="' + esc(k) + '" aria-label="' + label + '" title="' + label + '">×</button></div>';
  });
  el.innerHTML = html;
}

/* ---------- Render global con conservación del foco y del scroll ---------- */
function render(){
  const body = document.getElementById('view-asistida');
  const active = document.activeElement;
  const fk = active && active.dataset ? active.dataset.key : null, fa = active && active.dataset ? active.dataset.act : null, fc = active && active.dataset ? active.dataset.crit : null;
  const st = body.scrollTop;
  body.innerHTML = renderAsistida();
  body.scrollTop = st;
  renderCart();
  if (fk != null) {
    const sel = '[data-act="' + fa + '"][data-key="' + CSS.escape(fk) + '"]' + (fc ? '[data-crit="' + fc + '"]' : '');
    const t = document.querySelector(sel); if (t) t.focus({ preventScroll: true });
  }
}

/* ---------- Búsqueda de objetos por clave ---------- */
function findSyn(key){
  for (const g of DATA.grupos) for (const s of g.sindromes) if (synKey(g, s) === key) return { g, s };
  return null;
}
function findLine(key){
  const parts = key.split('\u241F');
  if (parts[0] === 'mu') return { muestra: parts[1], pruebas: [{ nombre: parts[2], loinc: muestrasIndex().get(parts[1]).get(parts[2]) }] };
  const r = findSyn(parts[0] + '\u241F' + parts[1]); if (!r) return null;
  return r.s.lineas.find(l => String(l.id) === parts[2]);
}

/* ---------- Eventos ---------- */
document.querySelector('.panel').addEventListener('click', e => {
  const t = e.target.closest('[data-act]'); if (!t) return;
  const act = t.dataset.act, key = t.dataset.key;
  if (act === 'cat') { state.cats[t.dataset.cat] = !state.cats[t.dataset.cat]; }
  else if (act === 'grp') { state.openGroup = state.openGroup === key ? null : key; }
  else if (act === 'mu') { state.selMuestra = state.selMuestra === key ? null : key; }
  else if (act === 'syn') {
    state.selSyn = state.selSyn === key ? null : key;   // solo despliega: no añade nada al carro
  }
  else if (act === 'line') {
    const l = findLine(key); if (!l) return;
    if (state.cart.has(lineKeyOf(l))) removeLine(l);
    else if (!lineInCart(l)) addLine(l);   // si ya está cubierta por un pack, no se duplica
  }
  else if (act === 'crit') { const c = t.dataset.crit; state.checks[key] = Object.assign({}, state.checks[key], { [c]: !(state.checks[key] || {})[c] }); }
  else return;
  render();
});
document.getElementById('cart').addEventListener('click', e => {
  const t = e.target.closest('[data-act="rm"]'); if (!t) return;
  state.cart.delete(t.dataset.key);
  render();
});
document.getElementById('clear').addEventListener('click', () => { state.cart.clear(); render(); });
document.getElementById('q').addEventListener('input', e => { state.q = e.target.value; render(); });
document.querySelectorAll('.seg button').forEach(b => b.addEventListener('click', () => {
  state.tipo = b.dataset.tipo; state.openGroup = null; state.selSyn = null; state.selMuestra = null;
  document.querySelectorAll('.seg button').forEach(x => x.setAttribute('aria-pressed', x === b));
  render();
}));
/* ---------- Pestañas inferiores (móvil) ---------- */
let savedScroll = 0;
document.querySelectorAll('.tabbtn').forEach(b => b.addEventListener('click', () => {
  const va = document.getElementById('view-asistida'), next = b.dataset.view;
  if (document.body.dataset.view === 'elegir' && next !== 'elegir') savedScroll = va.scrollTop;
  document.body.dataset.view = next;
  document.querySelectorAll('.tabbtn').forEach(x => x.setAttribute('aria-current', x === b ? 'true' : 'false'));
  if (next === 'elegir') va.scrollTop = savedScroll;
}));
/* ---------- Enviar ---------- */
const dlg = document.getElementById('dlg');
document.getElementById('send').addEventListener('click', () => {
  let html = '<p>Se enviarían <b>' + cartCount() + '</b> pruebas en <b>' + state.cart.size + '</b> líneas. Es un prototipo: no se envía nada.</p>';
  state.cart.forEach(l => {
    html += '<h3>' + fmt(l.muestra) + (l.pruebas.length > 1 ? '' : '') + '</h3><ul>';
    l.pruebas.forEach(p => html += '<li data-loinc="' + esc(p.loinc) + '">' + fmt(p.nombre) + (p.loinc && p.loinc !== 'LOINC no disponible' ? ' <span style="color:#666">(LOINC ' + esc(p.loinc) + ')</span>' : '') + '</li>');
    html += '</ul>';
  });
  document.getElementById('dlg-b').innerHTML = html;
  dlg.showModal();
});
document.getElementById('dlg-ok').addEventListener('click', () => dlg.close());

render();
})();
</script>
